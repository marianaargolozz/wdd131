<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Álbum responsivo de templos com filtros por data de consagração e tamanho."
  >
  <meta name="author" content="Mariana Argolo Santana">

  <title>Álbum de Templos | WDD 131</title>

  <link
    rel="stylesheet"
    href="estilos/templos-filtrados.css"
  >
  <link
    rel="stylesheet"
    href="estilos/templos-filtrados-large.css"
  >

  <script src="scripts/templos.js" defer></script>
  <script src="scripts/templos-filtrados.js" defer></script>
</head>

<body>
  <header>
    <div class="header-content">
      <span class="site-title">Álbum do Templo</span>

      <button
        id="menu-button"
        type="button"
        aria-label="Abrir menu de navegação"
        aria-controls="navigation"
        aria-expanded="false"
      >
        ☰
      </button>
    </div>

    <nav id="navigation" aria-label="Navegação principal">
      <a
        href="#"
        class="filter-link active"
        data-filter="inicio"
      >
        Página Inicial
      </a>

      <a
        href="#"
        class="filter-link"
        data-filter="antigos"
      >
        Antigo
      </a>

      <a
        href="#"
        class="filter-link"
        data-filter="novos"
      >
        Novo
      </a>

      <a
        href="#"
        class="filter-link"
        data-filter="grandes"
      >
        Grande
      </a>

      <a
        href="#"
        class="filter-link"
        data-filter="pequenos"
      >
        Pequeno
      </a>
    </nav>
  </header>

  <main>
    <h1 id="gallery-title">Álbum de Templos</h1>

    <p
      id="results-message"
      class="visually-hidden"
      aria-live="polite"
    ></p>

    <div
      id="temple-cards"
      class="temple-grid"
    ></div>
  </main>

  <footer>
    <p>
      &copy; <span id="current-year"></span>
      | Mariana Argolo Santana | Brasil
    </p>

    <p id="last-modified"></p>
  </footer>
</body>
</html>
