<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Álbum responsivo de templos com filtros por data de consagração e tamanho."
  >

  <meta name="author" content="Mariana Argolo Santana">

  <title>Álbum de Templos | WDD 131</title>

  <link
    rel="stylesheet"
    href="styles/templos-filtrados.css"
  >

  <link
    rel="stylesheet"
    href="styles/templos-filtrados-large.css"
    media="screen and (min-width: 42rem)"
  >

  <script src="scripts/templos.js" defer></script>
  <script src="scripts/templos-filtrados.js" defer></script>
</head>

<body>
  <header>
    <div class="header-container">
      <h1>Álbum de Templos</h1>

      <button
        id="menu-button"
        type="button"
        aria-label="Abrir menu de navegação"
        aria-expanded="false"
        aria-controls="navigation"
      >
        ☰
      </button>
    </div>

    <nav id="navigation" aria-label="Filtros de templos">
      <button
        type="button"
        class="filter-button active"
        data-filter="inicio"
        aria-pressed="true"
      >
        Início
      </button>

      <button
        type="button"
        class="filter-button"
        data-filter="antigos"
        aria-pressed="false"
      >
        Antigos
      </button>

      <button
        type="button"
        class="filter-button"
        data-filter="novos"
        aria-pressed="false"
      >
        Novos
      </button>

      <button
        type="button"
        class="filter-button"
        data-filter="grandes"
        aria-pressed="false"
      >
        Grandes
      </button>

      <button
        type="button"
        class="filter-button"
        data-filter="pequenos"
        aria-pressed="false"
      >
        Pequenos
      </button>
    </nav>
  </header>

  <main>
    <h2 id="gallery-title">Todos os templos</h2>

    <p
      id="results-message"
      class="visually-hidden"
      aria-live="polite"
    ></p>

    <div
      id="temple-cards"
      class="temple-grid"
    ></div>
  </main>

  <footer>
    <p>
      &copy; <span id="current-year"></span>
      | Mariana Argolo Santana | Brasil
    </p>

    <p id="last-modified"></p>
  </footer>
</body>
</html>
